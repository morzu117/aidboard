name: App

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: installer les dépendances WebView
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          options_apt=(-o Acquire::Retries=0 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for essai in 1 2 3; do
            if sudo env DEBIAN_FRONTEND=noninteractive apt-get "${options_apt[@]}" -o APT::Update::Error-Mode=any update &&
              sudo env DEBIAN_FRONTEND=noninteractive apt-get "${options_apt[@]}" install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf; then
              break
            fi
            if [ "$essai" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      # frontendDist pointe vers app/loading, déjà versionné : aucun build web nécessaire.
      - run: cargo test
        working-directory: app/src-tauri
