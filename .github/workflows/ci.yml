# Chantier 13.1 — le gate complet sur chaque PR et sur main, sous les deux Node supportés (D4).
# Le même `npm run gate` que la Definition of Done : typecheck, lint, build, tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    # Pas d'AID_HOME global : chaque test pose le sien, et pty-spawn vérifie la liste exacte des
    # AID_* vues par l'agent — une variable ambiante la fausse (constaté sur la première CI, PR #46).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # node-pty et better-sqlite3 se compilent depuis les sources quand aucun binaire prébuilt ne correspond
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm run gate

  # Chantier 18 (L.6) : le labo serveur — vrai sshd et vrai tmux dans un conteneur, joint par le vrai
  # ssh du runner (Docker y est installé). Hors du gate : le gate ne demande pas Docker (DL6).
  labo:
    name: labo serveur
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm run gate:labo

  # Chantier 51 (D328) : l'e2e complet sur chaque PR et sur main, sans mesh ni secret.
  e2e:
    name: e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-e2e
          path: test-results/
          retention-days: 7

  contrat-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y build-essential python3-venv
      - run: npm ci
      - run: npm install --global @openai/codex@0.172.0
      - run: |
          python3 -m venv "$RUNNER_TEMP/uv"
          "$RUNNER_TEMP/uv/bin/pip" install uv==0.12.19
          UV_TOOL_BIN_DIR="$RUNNER_TEMP/bin" "$RUNNER_TEMP/uv/bin/uv" tool install --python 3.14 mistral-vibe==3.1.5
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npx vitest run test/avis-contrat-cli.test.ts
        env:
          AID_CONTRAT_CLI: '1'
