<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AID — navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;background:#0e1013}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#262a31;border-radius:4px}
</style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0e1013; color: #e6e8eb; font-family: Inter, system-ui, sans-serif; font-size: 14px">

<div style="padding: 14px 12px 6px">
<button style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: #5de0a1; color: #06251a; border: 0; border-radius: 12px; padding: 11px 14px; font-weight: 600; font-size: 14px"><span style="font-size: 18px; line-height: 1">+</span>Nouveau sujet</button>
</div>

<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px">

<!-- Vues intelligentes -->
<sc-for list="{{views}}" as="v" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 12px; border-radius: 999px; background: {{v.bg}}; color: {{v.color}}; font-weight: {{v.weight}}">
<span style="width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: {{v.mark}}"></span>
<span style="flex-grow: 1">{{v.label}}</span>
<span style="font-size: 12px; color: {{v.countColor}}">{{v.count}}</span>
</div>
</sc-for>

<!-- Serveurs -->
<div style="display: flex; align-items: center; gap: 6px; height: 32px; margin-top: 16px; padding: 0 8px 0 12px; border-radius: 8px; background: {{serversBg}}">
<span style="flex-grow: 1; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d94a0">Serveurs</span>
<button aria-label="Ajouter un serveur" style="background: transparent; color: #8d94a0; border: 1px solid #23272e; border-radius: 6px; width: 26px; height: 26px; font-size: 15px; line-height: 1">+</button>
</div>
<sc-for list="{{servers}}" as="s" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px 0 12px; border-radius: 8px; background: {{s.bg}}; color: {{s.color}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{s.dot}}" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.name}}</span>
<span style="font-size: 12px; color: #8d94a0">{{s.when}}</span>
</div>
</sc-for>

<!-- Groupes -->
<div style="display: flex; align-items: center; gap: 6px; padding: 18px 8px 6px 12px">
<span style="flex-grow: 1; font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #8d94a0">Groupes</span>
<button onClick="{{toggleEdit}}" style="background: {{editBg}}; color: {{editColor}}; border: 1px solid {{editBorder}}; border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: 500">{{editLabel}}</button>
<button aria-label="Nouveau groupe" style="background: transparent; color: #8d94a0; border: 1px solid #23272e; border-radius: 6px; width: 26px; height: 26px; font-size: 15px; line-height: 1">+</button>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="8">
<div>
<div onClick="{{g.toggle}}" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px 0 4px; border-radius: 8px; cursor: pointer">
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5b616c" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></sc-if>
<span style="width: 14px; text-align: center; font-size: 11px; color: #8d94a0">{{g.chev}}</span>
<span style="width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: {{g.color}}"></span>
<span style="flex-grow: 1; font-weight: 500">{{g.name}}</span>
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}"><span style="color: #8d94a0; letter-spacing: 1px">···</span></sc-if>
<span style="font-size: 12px; color: #8d94a0">{{g.count}}</span>
</div>
<sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 10px; height: 34px; margin-left: 22px; padding: 0 10px 0 8px; border-radius: 8px; background: {{it.bg}}; color: {{it.color}}">
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5b616c" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></sc-if>
<span style="width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: {{it.dot}}"></span>
<span style="flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: {{it.weight}}">{{it.name}}</span>
<sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="background: #f2b84b; color: #2a1d00; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px">1</span></sc-if>
<sc-if value="{{edit}}" hint-placeholder-val="{{false}}"><span style="color: #8d94a0; letter-spacing: 1px">···</span></sc-if>
<span style="font-size: 12px; color: #8d94a0">{{it.when}}</span>
</div>
</sc-for>
</sc-if>
</div>
</sc-for>
</div>

<div style="border-top: 1px solid #23272e; padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8d94a0">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #5de0a1"></span>
<span style="flex-grow: 1">daemon local · mesh hors ligne</span>
<button aria-label="Réduire la barre" style="background: transparent; color: #8d94a0; border: 1px solid #23272e; border-radius: 6px; width: 26px; height: 24px; font-size: 12px">‹</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"all"},"edit":{"editor":"boolean","default":false},"$preview":{"width":320,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { edit: !!props.edit, closed: {} };
  }
  renderVals() {
    const active = this.props.active || 'all';
    const edit = this.state.edit;
    const closed = this.state.closed;
    const mk = (id, label, count, mark, urgent) => ({
      label, count, mark,
      bg: active === id ? '#1f252d' : 'transparent',
      color: active === id ? '#e6e8eb' : '#c4c9d2',
      weight: (active === id || urgent) ? '600' : '400',
      countColor: urgent ? '#f2b84b' : '#8d94a0'
    });
    const views = [
      mk('all', 'Tous les sujets', '8', '#5de0a1'),
      mk('decide', 'À décider', '1', '#f2b84b', true),
      mk('free', 'Agent libre', '4', '#6ea8ff'),
      mk('none', 'Sans agent', '3', '#5b616c'),
      mk('pinned', 'Épinglés', '0', '#a78bfa'),
      mk('archived', 'Archivés', '', '#3a3f48')
    ];
    const item = (id, name, when, dot, badge) => ({
      name, when, dot: dot || '#5b616c', badge: !!badge,
      bg: active === id ? '#1f252d' : 'transparent',
      color: active === id ? '#e6e8eb' : '#c4c9d2',
      weight: active === id ? '500' : '400'
    });
    const defs = [
      ['a-i-d', 'A-I-D', '#5de0a1', [item('rewrap', 'docs/cell-swairm-rewrap', '10 h')]],
      ['agent-kernel', 'Agent-kernel', '#a78bfa', [item('refacto', 'feat/refacto', '10 j')]],
      ['demo-sts', 'Demo-sts', '#f59e6b', [item('demo', 'fix/update-demo', '9 j')]],
      ['descent-wf', 'Descent-wf', '#6ea8ff', [item('lieutenants', 'feat/lieutenants', '2 min', '#6ea8ff')]],
      ['myskooli', 'Myskooli', '#f07ab0', [item('pagination', 'feat/supports-pagination-formats', '10 j')]],
      ['orgasso', 'Orgasso', '#f2b84b', [item('restart-dev', 'feat/restart-dev', '18 min', '#5de0a1', true)]],
      ['skifer', 'Skifer', '#4fd1d9', [item('skifer', 'refactor/minimal-examples', 'maintenant')]],
      ['swairm', 'Swairm', '#8d94a0', [item('cli', 'swairm-cli-interact', '58 min')]]
    ];
    const groups = defs.map(([id, name, color, items]) => ({
      name, color, items,
      open: !closed[id],
      chev: closed[id] ? '▸' : '▾',
      count: String(items.length),
      toggle: () => this.setState({ closed: Object.assign({}, closed, { [id]: !closed[id] }) })
    }));
    const servers = [{
      name: 'vps-ovh', when: '12 ms', dot: '#5de0a1',
      bg: active === 'vps-ovh' ? '#1f252d' : 'transparent',
      color: active === 'vps-ovh' ? '#e6e8eb' : '#c4c9d2'
    }];
    return {
      views, groups, edit, servers,
      serversBg: active === 'servers' ? '#1f252d' : 'transparent',
      toggleEdit: () => this.setState({ edit: !edit }),
      editLabel: edit ? 'Terminer' : 'Modifier',
      editBg: edit ? '#5de0a1' : 'transparent',
      editColor: edit ? '#06251a' : '#8d94a0',
      editBorder: edit ? '#5de0a1' : '#23272e'
    };
  }
}
</script>
</body>
</html>
